name: wager-ledger

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10


  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

  keycloak-bootstrap:
    image: alpine:3.20
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "-c", "apk add --no-cache bash curl jq >/dev/null && bash /scripts/keycloak-bootstrap.sh"]
    restart: "no"

  migrate:
    image: golang:1.22-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
      - migrate_gocache:/root/.cache/go-build
      - migrate_gomodcache:/go/pkg/mod
    entrypoint: ["sh", "-c"]
    command:
      - >
        go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1 &&
        migrate -path=/migrations -database=postgres://wager:wager@postgres:5432/wager_ledger?sslmode=disable up
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      APP_ENV: development
      SHUTDOWN_TIMEOUT: 15s
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager_ledger?sslmode=disable
      OIDC_ISSUER_URL: http://localhost:8081/realms/wager-ledger
      OIDC_JWKS_URL: http://keycloak:8080/realms/wager-ledger/protocol/openid-connect/certs
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      EVENTS_DLQ_URL: http://localstack:4566/000000000000/wager-events-dlq.fifo
    volumes:
      - .:/src
      - api_gocache:/root/.cache/go-build
      - api_gomodcache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak-bootstrap:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  api-production:
    profiles: [production]
    image: ${API_IMAGE:-wager-ledger-api:unconfigured}
    restart: unless-stopped
    init: true
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-/opt/wager-ledger/shared/.env.production}
        required: false
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # "Máquinas físicas" simuladas para scripts/multi-machine-test-docker.sh:
  # cada uma é um container Linux com seu próprio sshd, isolado do host e
  # das outras (processo de SO, rede e filesystem próprios) — o mais perto
  # de "3 máquinas físicas" que dá pra garantir só com `git clone` + Docker,
  # sem exigir que quem baixa o projeto possua hardware extra de verdade.
  # Ficam atrás do profile "multi-machine" para não subir em um `docker
  # compose up` normal.
  mmt-host1:
    profiles: [multi-machine]
    build:
      context: .
      dockerfile: docker/mmt-host.Dockerfile
    secrets:
      - mmt-authorized-keys
    ports:
      - "127.0.0.1:2221:22"

  mmt-host2:
    profiles: [multi-machine]
    build:
      context: .
      dockerfile: docker/mmt-host.Dockerfile
    secrets:
      - mmt-authorized-keys
    ports:
      - "127.0.0.1:2222:22"

  mmt-host3:
    profiles: [multi-machine]
    build:
      context: .
      dockerfile: docker/mmt-host.Dockerfile
    secrets:
      - mmt-authorized-keys
    ports:
      - "127.0.0.1:2223:22"

  migrate-production:
    image: ${MIGRATION_IMAGE:-wager-ledger-migrator:unconfigured}
    profiles: [production]
    restart: "no"
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-/opt/wager-ledger/shared/.env.production}
        required: false
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'exec migrate -path=/migrations -database="$$DATABASE_URL" up'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  mmt-authorized-keys:
    file: ./.mmt-ssh/authorized_keys

volumes:
  postgres_data:
  localstack_data:
  api_gocache:
  api_gomodcache:
  migrate_gocache:
  migrate_gomodcache:
